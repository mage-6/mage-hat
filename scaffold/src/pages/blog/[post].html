<!-- One page per item of the "blog" collection (the folder name). The item
     is available as `post` (the name in brackets). page.title and
     page.description come from the item's metadata unless set here. -->

<x-base>
  <article>
    <h1>{{ post.title }}</h1>
    <p class="date">{{ post.date }}</p>
    {{ post.body }}
  </article>

  <!-- Structured data for the article. Not every post has tags, so the
       loop sits inside an if; an undefined key would fail the build. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Article",
    "headline": "{{ post.title }}",
    "description": "{{ post.description }}",
    "datePublished": "{{ post.date }}",
    "url": "{{ site.url }}{{ post.url }}",
    "inLanguage": "{{ lang }}",
    "keywords": [
      <template if="post.tags"><template each="tag in post.tags">"{{ tag }}",</template></template>
    ]
  }
  </script>
</x-base>
