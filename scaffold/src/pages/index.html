<title>Home</title>
<meta name="description" content="A site built with MageHat.">

<x-base>
  <h1>{{ t.home.heading }}</h1>
  <p>{{ t.home.intro }}</p>

  <x-counter label="Clicks"></x-counter>

  <h2>{{ t.home.latest }}</h2>
  <x-card each="post in blog" title="{{ post.title }}" url="{{ post.url }}" date="{{ post.date }}">
    <p>{{ post.description }}</p>
  </x-card>
</x-base>
