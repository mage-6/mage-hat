# The only configuration file. Anything else here is available as site.<key>.
name = "My Site"
url = "https://example.com"

# Used by the layout: the social preview image (1200x630 for the best result)
# and the organisation's logo in structured data. A page overrides the image
# with <meta name="image" content="/...">.
image = "/photos/hat.jpg"

# First language is the default and lives at the site root.
# Others get a prefix: languages = ["en", "pt-BR"] puts Portuguese under /pt-br/.
languages = ["en"]

[collections.blog]
feed = true

# Folders outside src/ can be served or used as icon sets, for a brand kit
# shared with other projects:
#   [assets]
#   brand = "../brand/svg"     # served at /brand/
#   [icons]
#   brand = "../brand/svg"     # icon="brand:logo" reads ../brand/svg/logo.svg

# Files that grow with the content (a cover per story, a video) live in an R2
# bucket, not in the repository. `magehat media add photo.jpg name` uploads one
# and <img src="media:name"> uses it; see Media in `magehat -h`:
#   [media]
#   url = "https://media.example.com"   # the bucket's public address
#   bucket = "example-bucket-media"
#   account = "<Cloudflare account id>"

# Analytics with no per-site code: every page sends a page view to this
# endpoint, and a click on any element with data-track="signup" a conversion.
# Nothing is added to the site until the table is set; see Analytics in
# `magehat -h`:
#   [analytics]
#   endpoint = "https://events.example.com/v2/my-site"
