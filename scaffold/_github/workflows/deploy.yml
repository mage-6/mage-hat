# Deploys the site to its Cloudflare Worker (wrangler.toml names it) on every
# push to main and by hand from the Actions tab. Items dated ahead go live
# through drip.yml, the daily run this one switches on while any are
# scheduled and off when none are left (Collections and Deploy in
# `magehat -h`). The steps live in the MageHat repository and every site runs
# the current ones, like the binary itself.
#
# Needs one repository secret, CLOUDFLARE_API_TOKEN: Workers Scripts edit on
# the site's Cloudflare account, plus R2 edit when site.toml has [media].
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    uses: robo-kick/mage-hat/.github/workflows/deploy-site.yml@main
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
