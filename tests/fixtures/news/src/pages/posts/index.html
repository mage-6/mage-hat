<title>All posts, page {{ pager.number }}</title>
<meta name="description" content="Every post, newest first.">
<meta name="list" content="posts">
<meta name="per-page" content="2">

<x-base>
  <h1>All posts</h1>
  <p class="count">{{ pager.total }} posts, page {{ pager.number }} of {{ pager.count }}</p>
  <ul>
    <li each="post in pager.items"><a href="{{ post.url }}">{{ post.title }}</a></li>
  </ul>
  <x-pager pager="{{ pager }}"></x-pager>
</x-base>
