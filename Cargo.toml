[package]
name = "magehat"
version = "0.6.3"
edition = "2021"
description = "A tiny, deterministic compiler for plain HTML sites."
license = "MIT"

# Module docs show file layouts in indented blocks; they are not Rust code.
[lib]
doctest = false

[[bin]]
name = "magehat"
path = "src/main.rs"

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
indexmap = { version = "2", features = ["serde"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tiny_http = "0.12"
toml = "0.8"
# Only for downloading an icon the first time a build meets it.
ureq = { version = "3", default-features = false, features = ["rustls"] }
webp = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
