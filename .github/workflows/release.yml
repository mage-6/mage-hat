# Push a tag v<version> (matching Cargo.toml) and this packages the Windows
# and Linux builds and attaches them to a GitHub release. The Linux binary
# is static (musl), so it runs on any distro, including hosting build images.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: musl toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Package
        shell: pwsh
        # The C in libwebp-sys has to be compiled for musl too.
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: ./packaging/package.ps1 -Target ${{ matrix.target }} -Tag ${{ github.ref_name }}
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.zip
            release/*.tar.gz
