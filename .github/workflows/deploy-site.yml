# The deploy every MageHat site runs, called from the site's own
# .github/workflows/deploy.yml (push, manual) and drip.yml (daily), both
# written by `magehat init` or `magehat new deploy`: check, build, `wrangler
# deploy` wrapped by `indexnow`, `media prune`.
#
# Items dated ahead (Collections in the manual) go live through drip.yml. A
# scheduled run deploys only when its build differs from the live sitemap,
# and the last step keeps drip.yml enabled only while the build reports
# scheduled items, so a site with nothing pending runs nothing at all.
name: deploy-site
on:
  workflow_call:
    inputs:
      site:
        description: Folder holding site.toml and wrangler.toml, relative to the repository root
        type: string
        default: "."
    secrets:
      CLOUDFLARE_API_TOKEN:
        description: Workers Scripts edit on the site's account, plus R2 edit when site.toml has [media]
        required: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.site }}
    steps:
      # The whole history: each page's <lastmod> is the last commit that
      # changed its content (lastmod.rs), and a shallow clone has one date.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Always the current release, so a MageHat fix reaches every site at its
      # next deploy. One static binary: no Node toolchain, nothing that expires.
      - name: Install MageHat
        run: |
          curl -fsSL https://github.com/robo-kick/mage-hat/releases/latest/download/magehat-linux-x64.tar.gz | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/magehat-linux-x64" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/magehat-linux-x64/magehat" --version

      # A broken link or an undefined variable fails here rather than shipping.
      # The build report is kept: the last step reads what was scheduled.
      - name: Check and build
        run: |
          magehat check
          magehat build --json > "$RUNNER_TEMP/build.json" || { cat "$RUNNER_TEMP/build.json"; exit 1; }
          jq -r '"Built \(.pages) pages, \(.scheduled | length) scheduled"' "$RUNNER_TEMP/build.json"

      - name: Compare with the live site
        id: live
        if: github.event_name == 'schedule'
        run: |
          url=$(sed -n 's/^url *= *"\([^"]*\)".*/\1/p' site.toml | head -n 1)
          if [ -n "$url" ] && curl -fsSL --max-time 30 "$url/sitemap.xml" -o "$RUNNER_TEMP/live-sitemap.xml" \
             && cmp -s "$RUNNER_TEMP/live-sitemap.xml" dist/sitemap.xml; then
            echo "Nothing due: the build matches $url/sitemap.xml"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v6
        if: steps.live.outputs.changed != 'false'
        with:
          version: 10

      # indexnow wraps the deploy so it can tell Bing and the other IndexNow
      # engines only what this deploy changed. The deploy's exit code is the
      # step's: a failed ping is a warning, since the site is up by then.
      - name: Deploy
        if: steps.live.outputs.changed != 'false'
        run: magehat indexnow -- pnpm dlx wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Bucket objects no record names go; a failure here fails the run, which
      # is the alert, while the deploy above already stands.
      - name: Prune the media bucket
        if: steps.live.outputs.changed != 'false'
        run: |
          if grep -q '^\[media\]' site.toml; then magehat media prune; else echo "No media bucket"; fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # The daily run exists only while something is scheduled. The callers
      # grant `actions: write` for this; a site without drip.yml is told when
      # that matters. GitHub refuses to disable a workflow that is already
      # off (403), so the state is read first and only a change is sent.
      - name: Keep the daily run only while items are scheduled
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          n=$(jq '.scheduled | length' "$RUNNER_TEMP/build.json")
          state=$(gh api "repos/$GH_REPO/actions/workflows/drip.yml" --jq .state 2> /dev/null || echo missing)
          if [ "$state" = missing ]; then
            if [ "$n" != 0 ]; then
              echo "::warning::$n scheduled items but no .github/workflows/drip.yml, so they never go live: run magehat new deploy"
            fi
          elif [ "$n" = 0 ]; then
            if [ "$state" = active ]; then gh workflow disable drip.yml; fi
            echo "Nothing scheduled: the daily run is off"
          else
            if [ "$state" != active ]; then gh workflow enable drip.yml; fi
            echo "$n scheduled, the next due $(jq -r '.scheduled[0].due' "$RUNNER_TEMP/build.json"): the daily run is on"
          fi
